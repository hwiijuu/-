<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>単語帳 - 일본어 단어장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo-900:#182B45;
    --indigo-700:#22405F;
    --indigo-500:#3D5A80;
    --paper:#ECE3CE;
    --paper-dark:#DDD1B4;
    --ink:#2A2A28;
    --ink-soft:#5B5A52;
    --hanko:#A8342A;
    --hanko-dark:#7E241C;
    --gold:#B8923F;
    --line:rgba(42,42,40,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New','Noto Sans KR',sans-serif;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(42,42,40,0.05) 1px, transparent 0);
    background-size: 18px 18px;
  }
  .wrap{max-width:920px;margin:0 auto;padding:32px 24px 64px;}

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:2px solid var(--ink);
    padding-bottom:18px;
    margin-bottom:28px;
    flex-wrap:wrap;
    gap:12px;
  }
  header h1{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:38px;
    margin:0;
    letter-spacing:2px;
    color:var(--indigo-900);
  }
  header .sub{
    font-family:'Noto Sans KR',sans-serif;
    font-size:13px;
    color:var(--ink-soft);
    margin-top:4px;
    letter-spacing:0.5px;
  }
  header .stamp-count{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--indigo-700);
    text-align:right;
  }
  header .stamp-count b{
    font-size:22px;
    color:var(--hanko);
    display:block;
  }

  .tabs{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:24px;
  }
  .tab{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    padding:8px 16px;
    background:transparent;
    border:1.5px solid var(--ink);
    color:var(--ink);
    cursor:pointer;
    border-radius:0;
    position:relative;
  }
  .tab.active{
    background:var(--indigo-900);
    color:var(--paper);
    border-color:var(--indigo-900);
  }
  .tab .cnt{
    font-size:10px;
    opacity:0.7;
    margin-left:4px;
  }

  .stage{
    display:grid;
    grid-template-columns: 1fr;
    gap:24px;
  }

  .progress-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
  .progress-bar{
    flex:1;
    height:3px;
    background:var(--paper-dark);
    margin:0 14px;
    position:relative;
  }
  .progress-bar i{
    display:block;
    height:100%;
    background:var(--hanko);
  }

  .card-area{
    perspective:1600px;
    height:340px;
    position:relative;
  }
  .card{
    position:absolute;
    inset:0;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform 0.5s cubic-bezier(.2,.8,.2,1);
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    background:#fff;
    border:1.5px solid var(--ink);
    box-shadow:6px 6px 0 var(--indigo-900);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }
  .face.back{transform:rotateY(180deg);background:#F6F1E4;}

  .kanji{
    font-family:'Shippori Mincho',serif;
    font-weight:700;
    font-size:64px;
    color:var(--indigo-900);
    line-height:1.1;
  }
  .reading{
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-size:18px;
    color:var(--ink-soft);
    margin-top:8px;
  }
  .romaji{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--gold);
    margin-top:10px;
    letter-spacing:1px;
  }
  .level-badge{
    position:absolute;
    top:14px;
    left:16px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--indigo-700);
    border:1px solid var(--indigo-700);
    padding:2px 8px;
  }
  .hint{
    position:absolute;
    bottom:14px;
    right:16px;
    font-size:11px;
    color:var(--ink-soft);
    font-family:'Noto Sans KR',sans-serif;
  }
  .meaning{
    font-family:'Noto Sans KR',sans-serif;
    font-weight:700;
    font-size:30px;
    color:var(--indigo-900);
  }
  .example{
    margin-top:16px;
    font-size:15px;
    color:var(--ink);
    line-height:1.6;
  }
  .example .jp{font-family:'Zen Kaku Gothic New',sans-serif;}
  .example .kr{display:block;font-size:13px;color:var(--ink-soft);margin-top:2px;font-family:'Noto Sans KR',sans-serif;}

  .hanko-mark{
    position:absolute;
    width:56px;
    height:56px;
    top:14px;
    right:14px;
    border:3px solid var(--hanko);
    color:var(--hanko);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Shippori Mincho',serif;
    font-weight:700;
    font-size:13px;
    border-radius:6px;
    transform:rotate(-8deg);
    opacity:0.92;
    mix-blend-mode:multiply;
    letter-spacing:1px;
  }

  .controls{
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
  }
  .controls .side{display:flex;gap:8px;}
  button.ctl{
    font-family:'Noto Sans KR',sans-serif;
    font-size:14px;
    font-weight:500;
    padding:10px 18px;
    border:1.5px solid var(--ink);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
  }
  button.ctl:hover{background:var(--paper-dark);}
  button.ctl.primary{
    background:var(--indigo-900);
    color:var(--paper);
    border-color:var(--indigo-900);
  }
  button.ctl.primary:hover{background:var(--indigo-700);}
  button.ctl.stamp{
    background:var(--hanko);
    color:#fff;
    border-color:var(--hanko);
  }
  button.ctl.stamp:hover{background:var(--hanko-dark);}
  button.ctl:disabled{opacity:0.35;cursor:default;}

  .album{
    margin-top:36px;
    border-top:2px dashed var(--paper-dark);
    padding-top:20px;
  }
  .album h2{
    font-family:'Shippori Mincho',serif;
    font-size:17px;
    color:var(--indigo-900);
    margin:0 0 12px;
  }
  .album .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(90px,1fr));
    gap:10px;
  }
  .album .stamp-tile{
    border:1px solid var(--line);
    background:#fff;
    padding:8px 6px;
    text-align:center;
    position:relative;
  }
  .album .stamp-tile .k{
    font-family:'Shippori Mincho',serif;
    font-size:18px;
    color:var(--indigo-900);
  }
  .album .stamp-tile .m{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .album .stamp-tile::after{
    content:'済';
    position:absolute;
    top:2px;
    right:4px;
    font-family:'Shippori Mincho',serif;
    font-size:10px;
    color:var(--hanko);
  }
  .album .empty{
    font-size:13px;
    color:var(--ink-soft);
    font-style:italic;
  }

  @media (max-width:560px){
    header h1{font-size:28px;}
    .kanji{font-size:48px;}
    .meaning{font-size:24px;}
    .card-area{height:300px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>単語帳</h1>
      <div class="sub">일본어 단어 플래시카드 · 전 레벨 학습</div>
    </div>
    <div class="stamp-count">
      외운 단어
      <b id="stampTotal">0</b>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="stage">
    <div class="progress-row">
      <span id="posLabel">1 / 12</span>
      <div class="progress-bar"><i id="progressFill" style="width:0%"></i></div>
      <span id="deckLabel">전체</span>
    </div>

    <div class="card-area">
      <div class="card" id="card">
        <div class="face front">
          <span class="level-badge" id="levelBadgeFront"></span>
          <div class="kanji" id="kanjiText"></div>
          <div class="hanko-mark" id="hankoMarkFront" style="display:none;">覚えた</div>
          <div class="hint">클릭하여 뒤집기</div>
        </div>
        <div class="face back">
          <span class="level-badge" id="levelBadgeBack"></span>
          <div class="reading" id="readingText"></div>
          <div class="romaji" id="romajiText"></div>
          <div class="meaning" id="meaningText" style="margin-top:14px;"></div>
          <div class="example" id="exampleText"></div>
          <div class="hanko-mark" id="hankoMarkBack" style="display:none;">覚えた</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="side">
        <button class="ctl" id="prevBtn">← 이전</button>
        <button class="ctl" id="shuffleBtn">섞기</button>
      </div>
      <div class="side">
        <button class="ctl stamp" id="stampBtn">도장 찍기 (외웠음)</button>
        <button class="ctl primary" id="nextBtn">다음 →</button>
      </div>
    </div>
  </div>

  <div class="album">
    <h2>외운 단어 도장첩</h2>
    <div class="grid" id="albumGrid"></div>
  </div>

</div>

<script>
const DATA = {
  N5: [
    ["私","わたし","watashi","나 / 저",""],
    ["学校","がっこう","gakkou","학교","毎日学校へ行きます。 / 매일 학교에 갑니다."],
    ["食べる","たべる","taberu","먹다","朝ご飯を食べる。 / 아침밥을 먹다."],
    ["水","みず","mizu","물","水を飲みます。 / 물을 마십니다."],
    ["今日","きょう","kyou","오늘","今日は天気がいい。 / 오늘은 날씨가 좋다."],
    ["友達","ともだち","tomodachi","친구","友達と遊ぶ。 / 친구와 놀다."],
    ["大きい","おおきい","ookii","크다","大きい犬がいる。 / 큰 개가 있다."],
    ["行く","いく","iku","가다","学校に行く。 / 학교에 가다."],
    ["時間","じかん","jikan","시간","時間がない。 / 시간이 없다."],
    ["好き","すき","suki","좋아함","音楽が好きです。 / 음악을 좋아합니다."],
    ["本","ほん","hon","책","本を読む。 / 책을 읽다."],
    ["元気","げんき","genki","건강함, 활기참","お元気ですか。 / 잘 지내세요?"]
  ],
  N4: [
    ["経験","けいけん","keiken","경험","いい経験になった。 / 좋은 경험이 되었다."],
    ["準備","じゅんび","junbi","준비","旅行の準備をする。 / 여행 준비를 하다."],
    ["説明","せつめい","setsumei","설명","詳しく説明する。 / 자세히 설명하다."],
    ["便利","べんり","benri","편리함","このアプリは便利だ。 / 이 앱은 편리하다."],
    ["約束","やくそく","yakusoku","약속","約束を守る。 / 약속을 지키다."],
    ["心配","しんぱい","shinpai","걱정","心配しないで。 / 걱정하지 마."],
    ["続ける","つづける","tsuzukeru","계속하다","勉強を続ける。 / 공부를 계속하다."],
    ["最近","さいきん","saikin","최근","最近忙しい。 / 최근 바쁘다."],
    ["十分","じゅうぶん","juubun","충분함","十分な時間がある。 / 충분한 시간이 있다."],
    ["変える","かえる","kaeru","바꾸다","予定を変える。 / 예정을 바꾸다."],
    ["集める","あつめる","atsumeru","모으다","情報を集める。 / 정보를 모으다."],
    ["意見","いけん","iken","의견","意見を言う。 / 의견을 말하다."]
  ],
  N3: [
    ["影響","えいきょう","eikyou","영향","天気に影響される。 / 날씨에 영향받다."],
    ["判断","はんだん","handan","판단","冷静に判断する。 / 냉정하게 판단하다."],
    ["状況","じょうきょう","joukyou","상황","状況を確認する。 / 상황을 확인하다."],
    ["効果","こうか","kouka","효과","効果がある。 / 효과가 있다."],
    ["解決","かいけつ","kaiketsu","해결","問題を解決する。 / 문제를 해결하다."],
    ["印象","いんしょう","inshou","인상","第一印象が大事だ。 / 첫인상이 중요하다."],
    ["反対","はんたい","hantai","반대","計画に反対する。 / 계획에 반대하다."],
    ["割合","わりあい","wariai","비율","女性の割合が高い。 / 여성 비율이 높다."],
    ["対象","たいしょう","taishou","대상","学生を対象にする。 / 학생을 대상으로 하다."],
    ["維持","いじ","iji","유지","健康を維持する。 / 건강을 유지하다."],
    ["実際","じっさい","jissai","실제","実際に見てみる。 / 실제로 보다."],
    ["傾向","けいこう","keikou","경향","増加する傾向がある。 / 증가하는 경향이 있다."]
  ],
  N2: [
    ["概念","がいねん","gainen","개념","新しい概念を学ぶ。 / 새로운 개념을 배우다."],
    ["矛盾","むじゅん","mujun","모순","話に矛盾がある。 / 이야기에 모순이 있다."],
    ["抽象","ちゅうしょう","chuushou","추상","抽象的な表現。 / 추상적인 표현."],
    ["普及","ふきゅう","fukyuu","보급","スマホが普及した。 / 스마트폰이 보급되었다."],
    ["妥協","だきょう","dakyou","타협","妥協点を探す。 / 타협점을 찾다."],
    ["潜在","せんざい","senzai","잠재","潜在的な能力。 / 잠재적인 능력."],
    ["促進","そくしん","sokushin","촉진","成長を促進する。 / 성장을 촉진하다."],
    ["顕著","けんちょ","kencho","현저함","顕著な変化。 / 현저한 변화."],
    ["憶測","おくそく","okusoku","억측, 추측","憶測で話す。 / 추측으로 말하다."],
    ["遂行","すいこう","suikou","수행","任務を遂行する。 / 임무를 수행하다."],
    ["是正","ぜせい","zesei","시정","誤りを是正する。 / 오류를 시정하다."],
    ["円滑","えんかつ","enkatsu","원활함","円滑に進める。 / 원활하게 진행하다."]
  ],
  N1: [
    ["曖昧","あいまい","aimai","애매함","曖昧な返事。 / 애매한 대답."],
    ["逸脱","いつだつ","itsudatsu","일탈","規範から逸脱する。 / 규범에서 일탈하다."],
    ["顕在化","けんざいか","kenzaika","현재화, 드러남","問題が顕在化する。 / 문제가 드러나다."],
    ["折衝","せっしょう","sesshou","절충, 교섭","価格の折衝をする。 / 가격 교섭을 하다."],
    ["払拭","ふっしょく","fusshoku","불식","不安を払拭する。 / 불안을 불식하다."],
    ["示唆","しさ","shisa","시사","結果を示唆する。 / 결과를 시사하다."],
    ["錯綜","さくそう","sakusou","착종, 뒤얽힘","情報が錯綜する。 / 정보가 뒤얽히다."],
    ["逐次","ちくじ","chikuji","축차적으로","逐次報告する。 / 순차적으로 보고하다."],
    ["網羅","もうら","moura","망라","全項目を網羅する。 / 전 항목을 망라하다."],
    ["履行","りこう","rikou","이행","契約を履行する。 / 계약을 이행하다."],
    ["凌駕","りょうが","ryouga","능가","予想を凌駕する。 / 예상을 능가하다."],
    ["忌避","きひ","kihi","기피","責任を忌避する。 / 책임을 기피하다."]
  ]
};

const LEVELS = ["ALL","N5","N4","N3","N2","N1"];
let currentLevel = "ALL";
let deck = [];
let idx = 0;
let flipped = false;
let mastered = {};

function buildDeck(level){
  let list = [];
  if(level === "ALL"){
    Object.keys(DATA).forEach(lv=>{
      DATA[lv].forEach(w=>list.push({lv, w}));
    });
  } else {
    DATA[level].forEach(w=>list.push({lv:level, w}));
  }
  return list;
}

function keyOf(item){ return item.lv + "_" + item.w[0]; }

function renderTabs(){
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  LEVELS.forEach(lv=>{
    const btn = document.createElement("button");
    btn.className = "tab" + (lv===currentLevel ? " active":"");
    const count = lv==="ALL" ? Object.values(DATA).reduce((a,b)=>a+b.length,0) : DATA[lv].length;
    btn.innerHTML = (lv==="ALL" ? "전체" : lv) + ' <span class="cnt">('+count+')</span>';
    btn.onclick = ()=>{ currentLevel = lv; idx=0; flipped=false; deck = buildDeck(currentLevel); renderTabs(); renderCard(); };
    tabs.appendChild(btn);
  });
}

function renderCard(){
  const card = document.getElementById("card");
  card.classList.remove("flipped");
  flipped = false;

  const item = deck[idx];
  const [kanji, reading, romaji, meaning, example] = item.w;
  const isMastered = !!mastered[keyOf(item)];

  document.getElementById("kanjiText").textContent = kanji;
  document.getElementById("readingText").textContent = reading;
  document.getElementById("romajiText").textContent = romaji;
  document.getElementById("meaningText").textContent = meaning;
  document.getElementById("levelBadgeFront").textContent = item.lv;
  document.getElementById("levelBadgeBack").textContent = item.lv;

  if(example){
    const parts = example.split(" / ");
    document.getElementById("exampleText").innerHTML =
      '<span class="jp">'+parts[0]+'</span><span class="kr">'+(parts[1]||"")+'</span>';
  } else {
    document.getElementById("exampleText").innerHTML = "";
  }

  document.getElementById("hankoMarkFront").style.display = isMastered ? "flex":"none";
  document.getElementById("hankoMarkBack").style.display = isMastered ? "flex":"none";

  document.getElementById("posLabel").textContent = (idx+1)+" / "+deck.length;
  document.getElementById("deckLabel").textContent = currentLevel==="ALL" ? "전체" : currentLevel;
  document.getElementById("progressFill").style.width = Math.round(((idx+1)/deck.length)*100)+"%";

  document.getElementById("stampBtn").textContent = isMastered ? "도장 취소" : "도장 찍기 (외웠음)";

  document.getElementById("prevBtn").disabled = idx===0;
  document.getElementById("nextBtn").disabled = idx===deck.length-1;

  renderAlbum();
  renderTotal();
}

function renderTotal(){
  document.getElementById("stampTotal").textContent = Object.keys(mastered).length;
}

function renderAlbum(){
  const grid = document.getElementById("albumGrid");
  const keys = Object.keys(mastered);
  if(keys.length===0){
    grid.innerHTML = '<div class="empty">아직 도장을 찍은 단어가 없어요. 카드를 뒤집고 "도장 찍기"를 눌러보세요.</div>';
    return;
  }
  grid.innerHTML = "";
  keys.forEach(k=>{
    const info = mastered[k];
    const tile = document.createElement("div");
    tile.className = "stamp-tile";
    tile.innerHTML = '<div class="k">'+info.kanji+'</div><div class="m">'+info.meaning+'</div>';
    grid.appendChild(tile);
  });
}

document.getElementById("card").addEventListener("click", ()=>{
  flipped = !flipped;
  document.getElementById("card").classList.toggle("flipped", flipped);
});

document.getElementById("prevBtn").onclick = (e)=>{
  e.stopPropagation();
  if(idx>0){ idx--; renderCard(); }
};
document.getElementById("nextBtn").onclick = (e)=>{
  e.stopPropagation();
  if(idx<deck.length-1){ idx++; renderCard(); }
};
document.getElementById("shuffleBtn").onclick = (e)=>{
  e.stopPropagation();
  for(let i=deck.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]] = [deck[j],deck[i]];
  }
  idx=0;
  renderCard();
};
document.getElementById("stampBtn").onclick = (e)=>{
  e.stopPropagation();
  const item = deck[idx];
  const k = keyOf(item);
  if(mastered[k]){
    delete mastered[k];
  } else {
    mastered[k] = { kanji:item.w[0], meaning:item.w[3] };
  }
  renderCard();
};

document.querySelectorAll(".face").forEach(f=>{
  f.querySelectorAll("button").forEach(b=>b.addEventListener("click", e=>e.stopPropagation()));
});

deck = buildDeck(currentLevel);
renderTabs();
renderCard();
</script>
</body>
</html>
