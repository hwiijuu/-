<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>単語帳 - 일본어 단어장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo-900:#182B45;
    --indigo-700:#22405F;
    --indigo-500:#3D5A80;
    --paper:#ECE3CE;
    --paper-dark:#DDD1B4;
    --ink:#2A2A28;
    --ink-soft:#5B5A52;
    --hanko:#A8342A;
    --hanko-dark:#7E241C;
    --gold:#B8923F;
    --line:rgba(42,42,40,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New','Noto Sans KR',sans-serif;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(42,42,40,0.05) 1px, transparent 0);
    background-size: 18px 18px;
  }
  .wrap{max-width:920px;margin:0 auto;padding:32px 24px 64px;}

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:2px solid var(--ink);
    padding-bottom:18px;
    margin-bottom:28px;
    flex-wrap:wrap;
    gap:12px;
  }
  header h1{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:38px;
    margin:0;
    letter-spacing:2px;
    color:var(--indigo-900);
  }
  header .sub{
    font-family:'Noto Sans KR',sans-serif;
    font-size:13px;
    color:var(--ink-soft);
    margin-top:4px;
    letter-spacing:0.5px;
  }
  header .stamp-count{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--indigo-700);
    text-align:right;
  }
  header .stamp-count b{
    font-size:22px;
    color:var(--hanko);
    display:block;
  }

  .tabs{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:24px;
  }
  .tab{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    padding:8px 16px;
    background:transparent;
    border:1.5px solid var(--ink);
    color:var(--ink);
    cursor:pointer;
    border-radius:0;
    position:relative;
  }
  .tab.active{
    background:var(--indigo-900);
    color:var(--paper);
    border-color:var(--indigo-900);
  }
  .tab .cnt{
    font-size:10px;
    opacity:0.7;
    margin-left:4px;
  }

  .stage{
    display:grid;
    grid-template-columns: 1fr;
    gap:24px;
  }

  .progress-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
  .progress-bar{
    flex:1;
    height:3px;
    background:var(--paper-dark);
    margin:0 14px;
    position:relative;
  }
  .progress-bar i{
    display:block;
    height:100%;
    background:var(--hanko);
  }

  .card-area{
    perspective:1600px;
    height:380px;
    position:relative;
  }
  .card{
    position:absolute;
    inset:0;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform 0.5s cubic-bezier(.2,.8,.2,1);
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    background:#fff;
    border:1.5px solid var(--ink);
    box-shadow:6px 6px 0 var(--indigo-900);
    overflow:hidden;
  }
  .face.back{transform:rotateY(180deg);background:#F6F1E4;}
  .face-scroll{
    width:100%;
    height:100%;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px 26px;
    box-sizing:border-box;
  }
  .face-scroll::-webkit-scrollbar{width:6px;}
  .face-scroll::-webkit-scrollbar-thumb{background:var(--paper-dark);border-radius:3px;}
  .face-scroll::-webkit-scrollbar-track{background:transparent;}

  .kanji{
    font-family:'Shippori Mincho',serif;
    font-weight:700;
    font-size:64px;
    color:var(--indigo-900);
    line-height:1.1;
  }
  .reading{
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-size:26px;
    color:var(--ink-soft);
    margin-top:8px;
  }
  .romaji{
    font-family:'JetBrains Mono',monospace;
    font-size:16px;
    color:var(--gold);
    margin-top:10px;
    letter-spacing:1px;
  }
  .level-badge{
    position:absolute;
    top:14px;
    left:16px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--indigo-700);
    border:1px solid var(--indigo-700);
    padding:2px 8px;
  }
  .hint{
    position:absolute;
    bottom:14px;
    right:16px;
    font-size:11px;
    color:var(--ink-soft);
    font-family:'Noto Sans KR',sans-serif;
  }
  .meaning{
    font-family:'Noto Sans KR',sans-serif;
    font-weight:700;
    font-size:42px;
    color:var(--indigo-900);
  }
  .example{
    margin-top:0;
    font-size:18px;
    color:var(--ink);
    line-height:1.6;
    text-align:left;
  }
  .example .jp{font-family:'Zen Kaku Gothic New',sans-serif;}
  .example .phon{display:block;font-size:14px;color:var(--gold);margin-top:4px;font-family:'JetBrains Mono',monospace;letter-spacing:0.3px;}
  .example .kr{display:block;font-size:15px;color:var(--ink-soft);margin-top:4px;font-family:'Noto Sans KR',sans-serif;}

  .example-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-top:16px;
    max-width:100%;
  }
  .audio-btn{
    flex-shrink:0;
    width:34px;
    height:34px;
    border-radius:50%;
    border:1.5px solid var(--indigo-700);
    background:#fff;
    color:var(--indigo-700);
    font-size:15px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .15s, color .15s, transform .1s;
    padding:0;
  }
  .audio-btn:hover{background:var(--indigo-700);color:#fff;}
  .audio-btn:active{transform:scale(0.9);}
  .audio-btn.playing{background:var(--hanko);border-color:var(--hanko);color:#fff;}

  .hanko-mark{
    position:absolute;
    width:56px;
    height:56px;
    top:14px;
    right:14px;
    border:3px solid var(--hanko);
    color:var(--hanko);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Shippori Mincho',serif;
    font-weight:700;
    font-size:13px;
    border-radius:6px;
    transform:rotate(-8deg);
    opacity:0.92;
    mix-blend-mode:multiply;
    letter-spacing:1px;
  }

  .controls{
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
  }
  .controls .side{display:flex;gap:8px;}
  button.ctl{
    font-family:'Noto Sans KR',sans-serif;
    font-size:14px;
    font-weight:500;
    padding:10px 18px;
    border:1.5px solid var(--ink);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
  }
  button.ctl:hover{background:var(--paper-dark);}
  button.ctl.primary{
    background:var(--indigo-900);
    color:var(--paper);
    border-color:var(--indigo-900);
  }
  button.ctl.primary:hover{background:var(--indigo-700);}
  button.ctl.stamp{
    background:var(--hanko);
    color:#fff;
    border-color:var(--hanko);
  }
  button.ctl.stamp:hover{background:var(--hanko-dark);}
  button.ctl:disabled{opacity:0.35;cursor:default;}

  .album{
    margin-top:36px;
    border-top:2px dashed var(--paper-dark);
    padding-top:20px;
  }
  .album h2{
    font-family:'Shippori Mincho',serif;
    font-size:17px;
    color:var(--indigo-900);
    margin:0 0 12px;
  }
  .album .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(90px,1fr));
    gap:10px;
  }
  .album .stamp-tile{
    border:1px solid var(--line);
    background:#fff;
    padding:8px 6px;
    text-align:center;
    position:relative;
  }
  .album .stamp-tile .k{
    font-family:'Shippori Mincho',serif;
    font-size:18px;
    color:var(--indigo-900);
  }
  .album .stamp-tile .m{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .album .stamp-tile::after{
    content:'済';
    position:absolute;
    top:2px;
    right:4px;
    font-family:'Shippori Mincho',serif;
    font-size:10px;
    color:var(--hanko);
  }
  .album .empty{
    font-size:13px;
    color:var(--ink-soft);
    font-style:italic;
  }

  .mode-tabs{
    display:flex;
    gap:10px;
    margin-bottom:22px;
  }
  .mode-tab{
    font-family:'Shippori Mincho',serif;
    font-size:16px;
    font-weight:700;
    padding:10px 22px;
    background:#fff;
    border:1.5px solid var(--ink);
    color:var(--ink-soft);
    cursor:pointer;
  }
  .mode-tab.active{
    background:var(--hanko);
    border-color:var(--hanko);
    color:#fff;
  }

  .kana-subtabs{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:20px;
  }
  .kana-subtabs .grp{display:flex;gap:8px;}

  .kana-chart-block{margin-bottom:32px;}
  .kana-chart-block h3{
    font-family:'Shippori Mincho',serif;
    font-size:15px;
    color:var(--indigo-900);
    margin:0 0 10px;
    border-left:4px solid var(--hanko);
    padding-left:10px;
  }
  table.kana-table{
    border-collapse:collapse;
    width:100%;
    background:#fff;
  }
  table.kana-table td{
    border:1px solid var(--line);
    text-align:center;
    padding:8px 4px;
    width:20%;
  }
  table.kana-table td.empty-cell{background:var(--paper);border:1px solid transparent;}
  .kc .kj{
    display:block;
    font-family:'Shippori Mincho',serif;
    font-size:22px;
    color:var(--indigo-900);
  }
  .kc .rj{
    display:block;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--gold);
    margin-top:2px;
  }

  .kanji-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
  }
  .reading-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .audio-btn.small{
    width:26px;
    height:26px;
    font-size:12px;
  }
  .kana-char-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
  }

  .vocab-view-tabs{
    display:flex;
    gap:10px;
    margin-bottom:20px;
  }

  .table-wrap{
    border:1.5px solid var(--ink);
    background:#fff;
    max-height:520px;
    overflow:auto;
    box-shadow:6px 6px 0 var(--indigo-900);
  }
  table.vocab-table{
    border-collapse:collapse;
    width:100%;
    min-width:720px;
  }
  table.vocab-table thead th{
    position:sticky;
    top:0;
    z-index:1;
    background:var(--indigo-900);
    color:var(--paper);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    font-weight:500;
    text-align:left;
    padding:10px 12px;
    letter-spacing:0.5px;
    white-space:nowrap;
  }
  table.vocab-table tbody td{
    border-bottom:1px solid var(--line);
    padding:10px 12px;
    font-size:13px;
    color:var(--ink);
    vertical-align:top;
  }
  table.vocab-table tbody tr:hover{background:var(--paper);}
  table.vocab-table td.col-level{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--indigo-700);
    white-space:nowrap;
  }
  table.vocab-table td.col-kanji{
    font-family:'Shippori Mincho',serif;
    font-weight:700;
    font-size:16px;
    color:var(--indigo-900);
    white-space:nowrap;
  }
  table.vocab-table td.col-reading{
    color:var(--ink-soft);
    white-space:nowrap;
  }
  table.vocab-table td.col-romaji{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--gold);
    white-space:nowrap;
  }
  table.vocab-table td.col-meaning{
    font-weight:500;
    white-space:nowrap;
  }
  table.vocab-table td.col-example{
    font-size:12px;
    color:var(--ink-soft);
    min-width:260px;
  }
  table.vocab-table td.col-example .fu{color:var(--ink);}
  table.vocab-table td.col-example .phon{display:block;margin-top:3px;color:var(--gold);font-family:'JetBrains Mono',monospace;font-size:11px;}
  table.vocab-table td.col-example .kr{display:block;margin-top:2px;}
  .table-empty{
    padding:30px;
    text-align:center;
    font-size:13px;
    color:var(--ink-soft);
    font-style:italic;
  }
  .stamp-tile{cursor:pointer;transition:transform .1s, box-shadow .1s;}
  .stamp-tile:hover{transform:translateY(-2px);box-shadow:2px 2px 0 var(--indigo-900);}

  @media (max-width:560px){
    header h1{font-size:28px;}
    .kanji{font-size:48px;}
    .meaning{font-size:34px;}
    .card-area{height:360px;}
    .face-scroll{padding:24px 18px;}
    .audio-btn{width:30px;height:30px;font-size:13px;}
    .audio-btn.small{width:22px;height:22px;font-size:11px;}
    table.kana-table td{padding:6px 2px;}
    .kc .kj{font-size:17px;}
    .table-wrap{max-height:440px;}
    table.vocab-table{min-width:600px;}
    table.vocab-table thead th{font-size:10px;padding:8px 8px;}
    table.vocab-table tbody td{font-size:12px;padding:8px 8px;}
    .vocab-view-tabs{flex-wrap:wrap;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>単語帳</h1>
      <div class="sub">일본어 단어 플래시카드 · 히라가나·가타카나 · 전 레벨 학습</div>
    </div>
    <div class="stamp-count">
      외운 단어
      <b id="stampTotal">0</b>
    </div>
  </header>

  <div class="mode-tabs">
    <button class="mode-tab active" id="modeVocabBtn">単語 · 단어 카드</button>
    <button class="mode-tab" id="modeKanaBtn">かな · 히라가나·가타카나</button>
  </div>

  <div id="vocabSection">

    <div class="tabs" id="tabs"></div>

    <div class="vocab-view-tabs">
      <button class="tab active" id="vocabCardBtn">플래시카드</button>
      <button class="tab" id="vocabTableBtn">단어 표 보기</button>
    </div>

    <div id="vocabCardView">
    <div class="stage">
      <div class="progress-row">
        <span id="posLabel">1 / 12</span>
        <div class="progress-bar"><i id="progressFill" style="width:0%"></i></div>
        <span id="deckLabel">전체</span>
      </div>

      <div class="card-area">
        <div class="card" id="card">
          <div class="face front">
            <span class="level-badge" id="levelBadgeFront"></span>
            <div class="hanko-mark" id="hankoMarkFront" style="display:none;">覚えた</div>
            <div class="hint">클릭하여 뒤집기</div>
            <div class="face-scroll">
              <div class="kanji-row">
                <div class="kanji" id="kanjiText"></div>
                <button class="audio-btn small" id="kanjiAudioBtn" type="button" title="단어 듣기" aria-label="단어 듣기">🔊</button>
              </div>
            </div>
          </div>
          <div class="face back">
            <span class="level-badge" id="levelBadgeBack"></span>
            <div class="hanko-mark" id="hankoMarkBack" style="display:none;">覚えた</div>
            <div class="face-scroll">
              <div class="reading-row">
                <div class="reading" id="readingText"></div>
                <button class="audio-btn small" id="readingAudioBtn" type="button" title="단어 듣기" aria-label="단어 듣기">🔊</button>
              </div>
              <div class="romaji" id="romajiText"></div>
              <div class="meaning" id="meaningText" style="margin-top:14px;"></div>
              <div class="example-row">
                <div class="example" id="exampleText"></div>
                <button class="audio-btn" id="audioBtn" type="button" title="예문 듣기" aria-label="예문 듣기">🔊</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="controls">
        <div class="side">
          <button class="ctl" id="prevBtn">← 이전</button>
          <button class="ctl" id="shuffleBtn">섞기</button>
        </div>
        <div class="side">
          <button class="ctl stamp" id="stampBtn">도장 찍기 (외웠음)</button>
          <button class="ctl primary" id="nextBtn">다음 →</button>
        </div>
      </div>
    </div>

    <div class="album">
      <h2>외운 단어 도장첩</h2>
      <div class="grid" id="albumGrid"></div>
    </div>
    </div>

    <div id="vocabTableView" style="display:none;">
      <div class="table-wrap">
        <table class="vocab-table">
          <thead>
            <tr>
              <th>레벨</th>
              <th>단어(한자)</th>
              <th>히라가나</th>
              <th>로마자</th>
              <th>뜻</th>
              <th>예문</th>
            </tr>
          </thead>
          <tbody id="vocabTableBody"></tbody>
        </table>
      </div>
    </div>

  </div>

  <div id="kanaSection" style="display:none;">

    <div class="kana-subtabs">
      <div class="grp" id="kanaTypeTabs">
        <button class="tab active" id="kanaHiraBtn">히라가나</button>
        <button class="tab" id="kanaKataBtn">가타카나</button>
      </div>
      <div class="grp" id="kanaViewTabs">
        <button class="tab active" id="kanaChartBtn">표 보기</button>
        <button class="tab" id="kanaPracticeBtn">연습 모드</button>
      </div>
    </div>

    <div id="kanaChartView">
      <div class="kana-chart-block">
        <h3>청음 (清音)</h3>
        <table class="kana-table" id="kanaSeionTable"></table>
      </div>
      <div class="kana-chart-block">
        <h3>탁음 (濁音)</h3>
        <table class="kana-table" id="kanaDakuonTable"></table>
      </div>
      <div class="kana-chart-block">
        <h3>반탁음 (半濁音)</h3>
        <table class="kana-table" id="kanaHandakuonTable"></table>
      </div>
    </div>

    <div id="kanaPracticeView" style="display:none;">
      <div class="stage">
        <div class="progress-row">
          <span id="kanaPosLabel">1 / 46</span>
          <div class="progress-bar"><i id="kanaProgressFill" style="width:0%"></i></div>
          <span id="kanaDeckLabel">히라가나</span>
        </div>

        <div class="card-area">
          <div class="card" id="kanaCard">
            <div class="face front">
              <span class="level-badge" id="kanaBadgeFront"></span>
              <div class="hanko-mark" id="kanaHankoFront" style="display:none;">覚えた</div>
              <div class="hint">클릭하여 뒤집기</div>
              <div class="face-scroll">
                <div class="kana-char-row">
                  <div class="kanji" id="kanaCharText"></div>
                  <button class="audio-btn small" id="kanaAudioBtnFront" type="button" title="발음 듣기" aria-label="발음 듣기">🔊</button>
                </div>
              </div>
            </div>
            <div class="face back">
              <span class="level-badge" id="kanaBadgeBack"></span>
              <div class="hanko-mark" id="kanaHankoBack" style="display:none;">覚えた</div>
              <div class="face-scroll">
                <div class="kana-char-row">
                  <div class="meaning" id="kanaRomajiBack"></div>
                  <button class="audio-btn small" id="kanaAudioBtnBack" type="button" title="발음 듣기" aria-label="발음 듣기">🔊</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="controls">
          <div class="side">
            <button class="ctl" id="kanaPrevBtn">← 이전</button>
            <button class="ctl" id="kanaShuffleBtn">섞기</button>

const STORAGE_KEY = "tangochou_mastered_v1";
const LEVELS = ["ALL","N5","N4","N3","N2","N1"];
let currentLevel = "ALL";
let deck = [];
let idx = 0;
let flipped = false;
let mastered = {};

function loadMastered(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      mastered = JSON.parse(raw);
    }
  }catch(e){
    mastered = {};
  }
}

function saveMastered(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(mastered));
  }catch(e){
  }
}

function buildDeck(level){
  let list = [];
  if(level === "ALL"){
    Object.keys(DATA).forEach(lv=>{
      DATA[lv].forEach((w,i)=>list.push({lv, w, wIdx:i}));
    });
  } else {
    DATA[level].forEach((w,i)=>list.push({lv:level, w, wIdx:i}));
  }
  return list;
}

// 레벨 + 원본 배열 인덱스 + 뜻을 조합해 완전히 고유한 키를 생성한다.
// (표기가 같은 동음이의어가 추가되어도 학습 완료 상태가 서로 섞이지 않도록 함)
function keyOf(item){ return item.lv + "_" + item.wIdx + "_" + item.w[3]; }

// "일본어 / 한글 발음 / 한국어 뜻" 형태의 예문을 안전하게 분리한다.
// 구분자 앞뒤 공백 유무와 무관하게 정규식으로 매칭하고 각 파트를 trim한다.
// 예전 형식("일본어 / 한국어")과의 호환을 위해 2개 파트만 있으면 발음 파트를 비워둔다.
function splitExample(example){
  if(!example) return ["", "", ""];
  const parts = example.split(/\s*\/\s*/).map(p=>(p||"").trim());
  if(parts.length >= 3){
    return [parts[0], parts[1], parts[2]];
  }
  return [parts[0] || "", "", parts[1] || ""];
}

// Web Speech API를 이용해 일본어 문장을 읽어준다.
function speakJapanese(text, btnEl){
  if(!text) return;
  if(!('speechSynthesis' in window)){
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ja-JP';
  utter.rate = 0.9;
  if(btnEl){
    btnEl.classList.add('playing');
    utter.onend = ()=> btnEl.classList.remove('playing');
    utter.onerror = ()=> btnEl.classList.remove('playing');
  }
  window.speechSynthesis.speak(utter);
}

function renderTabs(){
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  LEVELS.forEach(lv=>{
    const btn = document.createElement("button");
    btn.className = "tab" + (lv===currentLevel ? " active":"");
    const count = lv==="ALL" ? Object.values(DATA).reduce((a,b)=>a+b.length,0) : DATA[lv].length;
    btn.innerHTML = (lv==="ALL" ? "전체" : lv) + ' <span class="cnt">('+count+')</span>';
    btn.onclick = ()=>{
      currentLevel = lv; idx=0; flipped=false; deck = buildDeck(currentLevel); renderTabs(); renderCard();
      const tableView = document.getElementById("vocabTableView");
      if(tableView && tableView.style.display !== "none"){ renderVocabTable(); }
    };
    tabs.appendChild(btn);
  });
}

// 혹시 발음 데이터에 가타카나가 섞여 있어도 항상 히라가나로 통일해서 보여주기 위한 안전 변환.
function toHiraganaOnly(text){
  if(!text) return text;
  return text.replace(/[\u30A1-\u30F6]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
}

// 카드 뒷면 예문 안의 한자 단어 옆에 (요미가나)를 붙여서 보여준다. 괄호 안 발음은 항상 히라가나로만 표기한다.
// 예: kanji="学校", reading="がっこう", example="毎日学校へ行きます。"
//     -> "毎日学校(がっこう)へ行きます。"
function withFurigana(exampleJp, kanji, reading){
  const hiraReading = toHiraganaOnly(reading);
  if(!exampleJp || !kanji || !hiraReading || kanji === hiraReading) return exampleJp;
  if(exampleJp.indexOf(kanji) === -1) return exampleJp;
  return exampleJp.split(kanji).join(kanji + "(" + hiraReading + ")");
}

function showVocabCardView(){
  document.getElementById("vocabCardBtn").classList.add("active");
  document.getElementById("vocabTableBtn").classList.remove("active");
  document.getElementById("vocabCardView").style.display = "block";
  document.getElementById("vocabTableView").style.display = "none";
}
function showVocabTableView(){
  document.getElementById("vocabTableBtn").classList.add("active");
  document.getElementById("vocabCardBtn").classList.remove("active");
  document.getElementById("vocabCardView").style.display = "none";
  document.getElementById("vocabTableView").style.display = "block";
  renderVocabTable();
}

// 현재 선택된 레벨 탭(ALL 또는 N5~N1)에 맞춰 단어 표를 렌더링한다.
function renderVocabTable(){
  const tbody = document.getElementById("vocabTableBody");
  if(!tbody) return;
  const rows = buildDeck(currentLevel);
  if(rows.length === 0){
    tbody.innerHTML = '<tr><td colspan="6"><div class="table-empty">표시할 단어가 없습니다.</div></td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(item=>{
    const [kanji, reading, romaji, meaning, example] = item.w;
    const hiraReading = toHiraganaOnly(reading);
    const [jp, krPhon, kr] = splitExample(example);
    const jpFuri = withFurigana(jp, kanji, reading);
    const exampleHtml = jp
      ? '<span class="fu">'+jpFuri+'</span>'
        +(krPhon ? '<span class="phon">['+krPhon+']</span>' : '')
        +(kr ? '<span class="kr">'+kr+'</span>' : '')
      : "";
    return '<tr>'
      + '<td class="col-level">'+item.lv+'</td>'
      + '<td class="col-kanji">'+kanji+'</td>'
      + '<td class="col-reading">'+hiraReading+'</td>'
      + '<td class="col-romaji">'+romaji+'</td>'
      + '<td class="col-meaning">'+meaning+'</td>'
      + '<td class="col-example">'+exampleHtml+'</td>'
      + '</tr>';
  }).join("");
}

function renderCard(){
  // 카드가 바뀔 때는 재생 중이던 음성을 즉시 중지한다.
  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
  }

  const card = document.getElementById("card");
  card.classList.remove("flipped");
  flipped = false;

  const item = deck[idx];
  const [kanji, reading, romaji, meaning, example] = item.w;
  const isMastered = !!mastered[keyOf(item)];
  const hiraReading = toHiraganaOnly(reading);

  document.getElementById("kanjiText").textContent = kanji;
  document.getElementById("readingText").textContent = hiraReading;
  document.getElementById("romajiText").textContent = romaji;
  document.getElementById("meaningText").textContent = meaning;
  document.getElementById("levelBadgeFront").textContent = item.lv;
  document.getElementById("levelBadgeBack").textContent = item.lv;

  const audioBtn = document.getElementById("audioBtn");
  audioBtn.classList.remove("playing");
  document.getElementById("kanjiAudioBtn").classList.remove("playing");
  document.getElementById("readingAudioBtn").classList.remove("playing");
  const [jp, krPhon, kr] = splitExample(example);
  if(jp){
    const jpFuri = withFurigana(jp, kanji, reading);
    document.getElementById("exampleText").innerHTML =
      '<span class="jp">'+jpFuri+'</span>'
      +(krPhon ? '<span class="phon">['+krPhon+']</span>' : '')
      +(kr ? '<span class="kr">'+kr+'</span>' : '');
    audioBtn.style.display = "flex";
  } else {
    document.getElementById("exampleText").innerHTML = "";
    audioBtn.style.display = "none";
  }

  document.getElementById("hankoMarkFront").style.display = isMastered ? "flex":"none";
  document.getElementById("hankoMarkBack").style.display = isMastered ? "flex":"none";

  document.getElementById("posLabel").textContent = (idx+1)+" / "+deck.length;
  document.getElementById("deckLabel").textContent = currentLevel==="ALL" ? "전체" : currentLevel;
  document.getElementById("progressFill").style.width = Math.round(((idx+1)/deck.length)*100)+"%";

  document.getElementById("stampBtn").textContent = isMastered ? "도장 취소" : "도장 찍기 (외웠음)";

  document.getElementById("prevBtn").disabled = idx===0;
  document.getElementById("nextBtn").disabled = idx===deck.length-1;

  renderAlbum();
  renderTotal();
}

function renderTotal(){
  document.getElementById("stampTotal").textContent = Object.keys(mastered).length;
}

function renderAlbum(){
  const grid = document.getElementById("albumGrid");
  const keys = Object.keys(mastered);
  if(keys.length===0){
    grid.innerHTML = '<div class="empty">아직 도장을 찍은 단어가 없어요. 카드를 뒤집고 "도장 찍기"를 눌러보세요.</div>';
    return;
  }
  grid.innerHTML = "";
  keys.forEach(k=>{
    const info = mastered[k];
    const tile = document.createElement("div");
    tile.className = "stamp-tile";
    tile.innerHTML = '<div class="k">'+info.kanji+'</div><div class="m">'+info.meaning+'</div>';
    if(info.lv !== undefined && info.wIdx !== undefined){
      tile.title = "클릭하면 해당 단어 카드로 이동합니다";
      tile.onclick = ()=> jumpToWord(info.lv, info.wIdx);
    }
    grid.appendChild(tile);
  });
}

// 도장첩에서 특정 단어(레벨+원본 인덱스)로 즉시 이동한다.
// 필요하면 레벨 탭을 해당 레벨로 전환하고, 플래시카드 모드/보기로 되돌린 뒤 카드를 갱신한다.
function jumpToWord(lv, wIdx){
  if(currentLevel !== lv){
    currentLevel = lv;
    deck = buildDeck(currentLevel);
    renderTabs();
  }
  const foundIdx = deck.findIndex(d=> d.lv===lv && d.wIdx===wIdx);
  if(foundIdx >= 0){
    idx = foundIdx;
  }
  showVocabCardView();
  renderCard();
  const cardArea = document.querySelector("#vocabCardView .card-area");
  if(cardArea){ cardArea.scrollIntoView({behavior:"smooth", block:"center"}); }
}

document.getElementById("card").addEventListener("click", ()=>{
  flipped = !flipped;
  document.getElementById("card").classList.toggle("flipped", flipped);
});

document.getElementById("prevBtn").onclick = (e)=>{
  e.stopPropagation();
  if(idx>0){ idx--; renderCard(); }
};
document.getElementById("nextBtn").onclick = (e)=>{
  e.stopPropagation();
  if(idx<deck.length-1){ idx++; renderCard(); }
};
document.getElementById("shuffleBtn").onclick = (e)=>{
  e.stopPropagation();
  for(let i=deck.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]] = [deck[j],deck[i]];
  }
  idx=0;
  renderCard();
};
document.getElementById("stampBtn").onclick = (e)=>{
  e.stopPropagation();
  const item = deck[idx];
  const k = keyOf(item);
  if(mastered[k]){
    delete mastered[k];
  } else {
    mastered[k] = { kanji:item.w[0], meaning:item.w[3], lv:item.lv, wIdx:item.wIdx };
  }
  saveMastered();
  renderCard();
};

// 플래시카드 화면의 단어 음성(🔊) 버튼 전용 함수.
// 항상 "현재 화면에 렌더링되어 보이는" 덱 배열(deck)과 인덱스(idx)에서 직접 단어를 읽어오므로,
// 레벨 탭 전환이나 셔플(섞기)로 순서가 바뀌어도 재생되는 음성이 화면과 100% 동기화된다.
// (원본 DATA 배열을 별도 인덱스로 다시 조회하지 않고, 화면에 쓰인 deck[idx]를 그대로 사용하는 것이 핵심)
function speakVocab(field, btnEl){
  const item = deck[idx];
  if(!item) return;
  let text = "";
  if(field === "example"){
    const [jp] = splitExample(item.w[4]);
    text = jp;
  } else {
    // "kanji"(카드 앞면), "reading"(카드 뒷면) 모두 한자 표기(w[0])를 그대로 읽히면
    // 일부 단어(예: "私")에서 TTS 엔진이 첫 글자를 씹거나 뭉개는 문제가 있어,
    // 항상 히라가나 발음 표기(w[1])를 읽어서 또박또박한 발음이 나오도록 한다.
    text = toHiraganaOnly(item.w[1]);
  }
  speakJapanese(text, btnEl);
}

const KANA_STORAGE_KEY = "tangochou_kana_mastered_v1";
let kanaType = "hiragana";
let kanaMode = "chart";
let kanaDeck = [];
let kanaIdx = 0;
let kanaFlipped = false;
let kanaMastered = {};

function loadKanaMastered(){
  try{
    const raw = localStorage.getItem(KANA_STORAGE_KEY);
    if(raw){ kanaMastered = JSON.parse(raw); }
  }catch(e){
    kanaMastered = {};
  }
}
function saveKanaMastered(){
  try{
    localStorage.setItem(KANA_STORAGE_KEY, JSON.stringify(kanaMastered));
  }catch(e){}
}

function renderKanaTable(tableEl, rows){
  tableEl.innerHTML = "";
  rows.forEach(row=>{
    const tr = document.createElement("tr");
    row.forEach(cell=>{
      const td = document.createElement("td");
      if(cell){
        td.innerHTML = '<div class="kc"><span class="kj">'+cell[0]+'</span><span class="rj">'+cell[1]+'</span></div>';
      } else {
        td.className = "empty-cell";
      }
      tr.appendChild(td);
    });
    tableEl.appendChild(tr);
  });
}

function renderKanaChart(){
  const set = KANA[kanaType];
  renderKanaTable(document.getElementById("kanaSeionTable"), set.seion);
  renderKanaTable(document.getElementById("kanaDakuonTable"), set.dakuon);
  renderKanaTable(document.getElementById("kanaHandakuonTable"), set.handakuon);
}

function buildKanaDeck(type){
  const set = KANA[type];
  let list = [];
  ["seion","dakuon","handakuon"].forEach(group=>{
    set[group].forEach(row=>{
      row.forEach(cell=>{
        if(cell) list.push({type, char:cell[0], romaji:cell[1]});
      });
    });
  });
  return list;
}

function kanaKeyOf(item){ return item.type + "_" + item.char; }

function renderKanaCard(){
  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
  }
  const card = document.getElementById("kanaCard");
  // 카드가 바뀔 때 클래스와 상태 변수를 함께 초기화해 앞면이 항상 먼저 보이도록 동기화한다.
  card.classList.remove("flipped");
  kanaFlipped = false;

  const item = kanaDeck[kanaIdx];
  const isMastered = !!kanaMastered[kanaKeyOf(item)];
  const label = item.type === "hiragana" ? "히라가나" : "가타카나";

  document.getElementById("kanaAudioBtnFront").classList.remove("playing");
  document.getElementById("kanaAudioBtnBack").classList.remove("playing");
  document.getElementById("kanaCharText").textContent = item.char;
  document.getElementById("kanaRomajiBack").textContent = item.romaji;
  document.getElementById("kanaBadgeFront").textContent = label;
  document.getElementById("kanaBadgeBack").textContent = label;

  document.getElementById("kanaHankoFront").style.display = isMastered ? "flex":"none";
  document.getElementById("kanaHankoBack").style.display = isMastered ? "flex":"none";

  document.getElementById("kanaPosLabel").textContent = (kanaIdx+1)+" / "+kanaDeck.length;
  document.getElementById("kanaDeckLabel").textContent = label;
  document.getElementById("kanaProgressFill").style.width = Math.round(((kanaIdx+1)/kanaDeck.length)*100)+"%";

  document.getElementById("kanaStampBtn").textContent = isMastered ? "도장 취소" : "도장 찍기 (외웠음)";
  document.getElementById("kanaPrevBtn").disabled = kanaIdx===0;
  document.getElementById("kanaNextBtn").disabled = kanaIdx===kanaDeck.length-1;

  renderKanaAlbum();
  renderKanaTotal();
}

function renderKanaTotal(){
  document.getElementById("kanaStampTotal").textContent = Object.keys(kanaMastered).length;
}

function renderKanaAlbum(){
  const grid = document.getElementById("kanaAlbumGrid");
  const keys = Object.keys(kanaMastered);
  if(keys.length===0){
    grid.innerHTML = '<div class="empty">아직 도장을 찍은 가나가 없어요. 카드를 뒤집고 "도장 찍기"를 눌러보세요.</div>';
    return;
  }
  grid.innerHTML = "";
  keys.forEach(k=>{
    const info = kanaMastered[k];
    const tile = document.createElement("div");
    tile.className = "stamp-tile";
    tile.innerHTML = '<div class="k">'+info.char+'</div><div class="m">'+info.romaji+'</div>';
    if(info.type){
      tile.title = "클릭하면 해당 가나 연습 카드로 이동합니다";
      tile.onclick = ()=> jumpToKana(info.type, info.char);
    }
    grid.appendChild(tile);
  });
}

// 가나 도장첩에서 특정 가나(타입+문자)로 즉시 이동하고 연습 모드로 전환한다.
function jumpToKana(type, char){
  if(kanaType !== type){
    kanaType = type;
    document.getElementById("kanaHiraBtn").classList.toggle("active", type==="hiragana");
    document.getElementById("kanaKataBtn").classList.toggle("active", type==="katakana");
    renderKanaChart();
    kanaDeck = buildKanaDeck(kanaType);
  }
  const foundIdx = kanaDeck.findIndex(it=> it.type===type && it.char===char);
  if(foundIdx >= 0){ kanaIdx = foundIdx; }

  document.getElementById("kanaPracticeBtn").classList.add("active");
  document.getElementById("kanaChartBtn").classList.remove("active");
  document.getElementById("kanaChartView").style.display = "none";
  document.getElementById("kanaPracticeView").style.display = "block";

  renderKanaCard();
  const cardArea = document.querySelector("#kanaPracticeView .card-area");
  if(cardArea){ cardArea.scrollIntoView({behavior:"smooth", block:"center"}); }
}

document.getElementById("kanaCard").addEventListener("click", ()=>{
  kanaFlipped = !kanaFlipped;
  document.getElementById("kanaCard").classList.toggle("flipped", kanaFlipped);
});
document.getElementById("kanaPrevBtn").onclick = (e)=>{
  e.stopPropagation();
  if(kanaIdx>0){ kanaIdx--; renderKanaCard(); }
};
document.getElementById("kanaNextBtn").onclick = (e)=>{
  e.stopPropagation();
  if(kanaIdx<kanaDeck.length-1){ kanaIdx++; renderKanaCard(); }
};
document.getElementById("kanaShuffleBtn").onclick = (e)=>{
  e.stopPropagation();
  for(let i=kanaDeck.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [kanaDeck[i],kanaDeck[j]] = [kanaDeck[j],kanaDeck[i]];
  }
  kanaIdx=0;
  renderKanaCard();
};
document.getElementById("kanaStampBtn").onclick = (e)=>{
  e.stopPropagation();
  const item = kanaDeck[kanaIdx];
  const k = kanaKeyOf(item);
  if(kanaMastered[k]){
    delete kanaMastered[k];
  } else {
    kanaMastered[k] = { char:item.char, romaji:item.romaji, type:item.type };
  }
  saveKanaMastered();
  renderKanaCard();
};

document.getElementById("kanaAudioBtnFront").onclick = (e)=>{
  e.stopPropagation();
  const item = kanaDeck[kanaIdx];
  speakJapanese(item.char, document.getElementById("kanaAudioBtnFront"));
};
document.getElementById("kanaAudioBtnBack").onclick = (e)=>{
  e.stopPropagation();

};

  if('speechSynthesis' in window){ window.speechSynthesis.cancel(); }
  document.getElementById("modeVocabBtn").classList.add("active");

loadKanaMastered();
renderKanaChart();
kanaDeck = buildKanaDeck(kanaType);
renderKanaCard();
